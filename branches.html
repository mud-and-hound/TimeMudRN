<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการสาขา · TimeMud Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>TIMEMUD ADMIN</h2>
      <span id="user-branch">Mud &amp; Hound</span>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item">แดชบอร์ด</a>
      <a href="attendance.html" class="nav-item">ประวัติเข้า-ออก</a>
      <a href="branches.html" class="nav-item active">จัดการสาขา</a>
      <a href="beacons.html" class="nav-item">จัดการ Beacon</a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn-secondary" style="width:100%" onclick="logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>จัดการสาขา</h1>
        <p>สาขาทั้งหมดในระบบ พร้อมพิกัด Geofence</p>
      </div>
      <button class="btn-add" id="add-btn">+ เพิ่มสาขา</button>
    </div>

    <div id="content">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>
</div>

<!-- Modal: เพิ่ม/แก้ไข สาขา -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box">
    <h3 id="modal-title">เพิ่มสาขา</h3>
    <form id="branch-form">
      <input type="hidden" id="f-id">
      <div class="field">
        <label>ชื่อสาขา</label>
        <input type="text" id="f-name" placeholder="เช่น Greyhound HQ" required>
      </div>
      <div style="display:flex; gap:12px;">
        <div class="field" style="flex:1">
          <label>Latitude</label>
          <input type="text" id="f-lat" placeholder="13.7305693" required>
        </div>
        <div class="field" style="flex:1">
          <label>Longitude</label>
          <input type="text" id="f-lng" placeholder="100.6071918" required>
        </div>
      </div>
      <div class="field">
        <label>รัศมี Geofence (เมตร)</label>
        <input type="number" id="f-radius" placeholder="100" value="100" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel">ยกเลิก</button>
        <button type="submit" class="btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/branches.js"></script>
</body>
</html>
