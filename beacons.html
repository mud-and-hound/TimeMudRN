<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการ Beacon · TimeMud Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>TIMEMUD ADMIN</h2>
      <span id="user-branch">Mud &amp; Hound</span>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item">แดชบอร์ด</a>
      <a href="attendance.html" class="nav-item">ประวัติเข้า-ออก</a>
      <a href="branches.html" class="nav-item">จัดการสาขา</a>
      <a href="beacons.html" class="nav-item active">จัดการ Beacon</a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn-secondary" style="width:100%" onclick="logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>จัดการ Beacon</h1>
        <p>อุปกรณ์ Beacon ทั้งหมดในระบบ แยกตามสถานะการลงทะเบียน</p>
      </div>
      <button class="btn-add" id="add-btn">+ เพิ่ม Beacon</button>
    </div>

    <div id="content">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>
</div>

<!-- Modal: เพิ่ม/แก้ไข Beacon -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box">
    <h3 id="modal-title">เพิ่ม Beacon</h3>
    <form id="beacon-form">
      <input type="hidden" id="f-id">
      <div class="field">
        <label>ชื่อ (Label)</label>
        <input type="text" id="f-label" placeholder="เช่น MBM01" required>
      </div>
      <div class="field">
        <label>สาขา</label>
        <select id="f-branch" required></select>
      </div>
      <div class="field">
        <label>MAC Address</label>
        <input type="text" id="f-mac" placeholder="C30000088F6A" required style="font-family:monospace">
      </div>
      <div class="field">
        <label>UUID</label>
        <input type="text" id="f-uuid" placeholder="C63A00CB-603F-405A-9AB0-396D845D371E" required style="font-family:monospace">
      </div>
      <div style="display:flex; gap:12px;">
        <div class="field" style="flex:1">
          <label>Major</label>
          <input type="number" id="f-major" required>
        </div>
        <div class="field" style="flex:1">
          <label>Minor</label>
          <input type="number" id="f-minor" required>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel">ยกเลิก</button>
        <button type="submit" class="btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/beacons.js"></script>
</body>
</html>
