<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด · TimeMud Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>TIMEMUD ADMIN</h2>
      <span id="user-branch">Mud &amp; Hound</span>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item active" data-requires="super_admin">แดชบอร์ด</a>
      <a href="attendance.html" class="nav-item" data-requires="can_manage_users">ประวัติเข้า-ออก</a>
      <a href="branches.html" class="nav-item" data-requires="super_admin">จัดการสาขา</a>
      <a href="beacons.html" class="nav-item" data-requires="can_manage_devices">จัดการ Beacon</a>
      <a href="permissions.html" class="nav-item" data-requires="super_admin">จัดการสิทธิ์</a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn-secondary" style="width:100%" onclick="logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>แดชบอร์ด</h1>
        <p>ภาพรวมระบบ ณ วันนี้</p>
      </div>
    </div>

    <div class="section-label">เมนูลัด</div>
    <div class="icon-menu-grid">
      <a href="dashboard.html" class="icon-menu-item active">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5"/>
            <path d="M5.5 9.5V20h13V9.5"/>
            <path d="M9.5 20v-6h5v6"/>
          </svg>
        </div>
        <span>หน้าหลัก</span>
      </a>
      <a href="attendance.html" class="icon-menu-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 12a8.5 8.5 0 1 0 3-6.5"/>
            <path d="M3.5 4.5v3.5H7"/>
            <path d="M12 8v4l3 2"/>
          </svg>
        </div>
        <span>ประวัติเข้า-ออก</span>
      </a>
      <a href="branches.html" class="icon-menu-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-6.5-6.1-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.9-6.5 11-6.5 11Z"/>
            <circle cx="12" cy="10" r="2.3"/>
          </svg>
        </div>
        <span>จัดการสาขา</span>
      </a>
      <a href="beacons.html" class="icon-menu-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 7l10 8-5 4V1l5 4-10 8"/>
          </svg>
        </div>
        <span>จัดการ Beacon</span>
      </a>
    </div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-label">สาขาทั้งหมด</div><div class="stat-value" id="stat-branches">—</div></div>
      <div class="stat-card"><div class="stat-label">Beacon ที่ใช้งานอยู่</div><div class="stat-value" id="stat-beacons">—</div></div>
      <div class="stat-card"><div class="stat-label">พนักงานในระบบ</div><div class="stat-value" id="stat-users">—</div></div>
      <div class="stat-card"><div class="stat-label">Clock-in วันนี้</div><div class="stat-value" id="stat-clockin">—</div></div>
    </div>

    <div class="section-label">รายการล่าสุดวันนี้</div>
    <div id="recent-wrap">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
