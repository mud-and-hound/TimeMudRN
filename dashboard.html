<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด · TimeMud Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>TIMEMUD ADMIN</h2>
      <span id="user-branch">Mud &amp; Hound</span>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item active">แดชบอร์ด</a>
      <a href="attendance.html" class="nav-item">ประวัติเข้า-ออก</a>
      <a href="branches.html" class="nav-item">จัดการสาขา</a>
      <a href="beacons.html" class="nav-item">จัดการ Beacon</a>
    </nav>
    <div class="sidebar-logout">
      <button class="btn-secondary" style="width:100%" onclick="logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>แดชบอร์ด</h1>
        <p>ภาพรวมระบบ ณ วันนี้</p>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-label">สาขาทั้งหมด</div><div class="stat-value" id="stat-branches">—</div></div>
      <div class="stat-card"><div class="stat-label">Beacon ที่ใช้งานอยู่</div><div class="stat-value" id="stat-beacons">—</div></div>
      <div class="stat-card"><div class="stat-label">พนักงานในระบบ</div><div class="stat-value" id="stat-users">—</div></div>
      <div class="stat-card"><div class="stat-label">Clock-in วันนี้</div><div class="stat-value" id="stat-clockin">—</div></div>
    </div>

    <div class="section-label">รายการล่าสุดวันนี้</div>
    <div id="recent-wrap">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
