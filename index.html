<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · TimeMud Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-split" id="card">
    <div class="login-visual">
      <div class="brand-mark">TM</div>
      <h1>TIMEMUD ADMIN</h1>
      <p>Time Attendance System<br>Mud &amp; Hound Public Company Limited</p>
    </div>
    <div class="login-form-panel">
      <h2>ลงชื่อเข้าใช้</h2>
      <p class="login-sub">สำหรับผู้ดูแลระบบเท่านั้น</p>
      <div class="error-msg" id="error"></div>
      <form id="login-form">
        <div class="field">
          <label>ชื่อผู้ใช้งาน</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
gsap.to('#card', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' });

const form = document.getElementById('login-form');
const errorBox = document.getElementById('error');
const submitBtn = document.getElementById('submit-btn');

/* ถ้า login อยู่แล้ว เด้งเข้าหน้าที่เหมาะสมตามสิทธิ์ */
if (getToken() && getCurrentUser()) {
  window.location.href = getLandingPage();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';

  try {
    await login(
      document.getElementById('username').value.trim(),
      document.getElementById('password').value
    );
    window.location.href = getLandingPage();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    gsap.fromTo('#card', { x: -8 }, { x: 0, duration: 0.4, ease: 'elastic.out(1, 0.4)' });
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'เข้าสู่ระบบ';
  }
});
</script>
</body>
</html>
